name: Validate, package, and release editor extensions

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and verify Flow core v0.43.0
        run: bash scripts/install-flow-core.sh install "$RUNNER_TEMP/nflow-v0.43.0" >/dev/null
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate editor tooling with the real Flow core
        run: npm run validate
      - name: Check JavaScript syntax
        run: |
          node --check fmt/cli.js
          node --check lsp/flow-language-server.js
          node --check vscode/extension.js
      - name: Compile-check current and legacy Zed wrappers
        run: |
          cargo check --manifest-path zed/Cargo.toml
          cargo check --manifest-path zed-legacy-0.230.2/Cargo.toml
      - name: Package artifacts
        run: bash scripts/package-release.sh "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: nexss-flow-editor-artifacts
          path: dist/*

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and verify Flow core v0.43.0
        run: bash scripts/install-flow-core.sh install "$RUNNER_TEMP/nflow-v0.43.0" >/dev/null
      - name: Package release assets
        run: bash scripts/package-release.sh "$GITHUB_WORKSPACE/dist"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

# Marketplace publishing is intentionally not part of this workflow yet.
# Add a separate marketplace workflow later when marketplace credentials and
# publisher accounts are ready; GitHub Releases require no marketplace setup.
