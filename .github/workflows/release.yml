name: Validate, package, and release editor extensions

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate repository
        run: python3 scripts/validate.py
      - name: Check LSP stub syntax
        run: node --check lsp/flow-language-server.js
      - name: Test formatter
        run: node --test fmt/test/*.test.js
      - name: Check formatted example
        run: node fmt/cli.js --check examples/complete.flow
      - name: Package artifacts
        run: bash scripts/package-release.sh "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: nexss-flow-editor-artifacts
          path: dist/*

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package release assets
        run: bash scripts/package-release.sh "$GITHUB_WORKSPACE/dist"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

# Marketplace publishing is intentionally not part of this workflow yet.
# Add a separate marketplace workflow later when marketplace credentials and
# publisher accounts are ready; GitHub Releases require no marketplace setup.
