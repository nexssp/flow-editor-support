# Language-server metadata for local development and extension wiring.
# The canonical published-extension declaration is in ../extension.toml.
# The launcher checks Flow core compatibility and starts native `nflow lsp`.
name = "nexss-flow-language-server"
command = "lsp/nexss-flow-language-server"

[language]
name = "Nexss Flow"
path_suffixes = ["nflow"]
